[project]
name = "churn-radar"
version = "1.0.0"
description = "Customer churn prediction with scikit-learn and a Streamlit dashboard"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
